name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  quality:
    name: Quality gate
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      - name: Typecheck, test and build
        run: npm run ci

  publish:
    name: Publish ${{ matrix.target }}
    needs: quality
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-pc-windows-msvc
            os: windows-latest
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install dependencies (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev libgtk-3-dev libjavascriptcoregtk-4.1-dev libsoup-3.0-dev

      - name: Install npm dependencies
        run: npm ci

      - name: Build with Tauri Action
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # Tauri signs all macOS bundle components before packaging; no Apple credentials are needed.
          APPLE_SIGNING_IDENTITY: ${{ runner.os == 'macOS' && '-' || '' }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'AI Canvas v0.10.16 - 素材复用与多厂商生成'
          releaseBody: |
            ## ✨ 版本摘要

            AI Canvas v0.10.16 完善素材整理、跨项目复用与快捷指令分享，新增 LibAPI 文本、图片、视频和音频模型。切换视频模型保留用户比例及兼容参数，同时补齐中英日韩界面与跨平台媒体、文件操作。

            ## 🎭 素材复用与快捷指令分享

            - 支持项目及全局人物、场景、道具的 `.aicassets` 导入导出；可导出单项、所选或整个库，导入前预览分类、媒体体积与同名提醒，完成后查看本次新增资产。
            - 创作卡片支持多选、批量导出和跨库复制；素材库与 @ 共用别名、声音、动作及领域字段搜索，支持名称、创建时间、更新时间和升降序，并记住排序选择。
            - 场景、道具支持最多 32 张带标题和说明的参考图，可设置主图、选择具体图片引用；切换主图不替换已有单图引用，单图与多图使用一致的引用胶囊。
            - 修复生成结果的多图回填和全局图片来源保留；重新生成次图不改变主图，缺失的全局图片不会误用项目同名文件，导入缺失文件按完整路径计数。
            - 可查看素材的使用位置，删除或清空前核对影响；失效文件及外部目录支持选择新位置和批量重连，也可勾选清理失效记录及关联，保留磁盘文件与画布节点。
            - 快捷指令支持复制 JSON、文件导出以及粘贴或文件导入，保留基础模板、高级步骤及原图引用配置；导入为独立新指令，不覆盖旧记录、不自动执行。高级步骤可按依赖并发生成，减少无依赖步骤的串行等待。

            ## 🔌 多厂商生成与视频参数

            - 内置 LibAPI 独立厂商入口和模型分组，默认展示已适配的 8 个主流文本、22 个图片、31 个视频、6 个音频型号；用户勾选后使用，拉取目录时按当前 Key 的实际可用清单更新。
            - 图片比例、分辨率、质量、背景及视频参考方式按具体渠道和型号声明；LibAPI 语音按型号提供音色、格式和语速，MiniMax／豆包使用平台已有音色 ID，Suno 音乐支持提示词、标题和歌词。
            - 切换视频模型保留用户已选比例及兼容的分辨率、时长、帧率和音频选择；未设置比例时不由参数面板强行写入，时长选项统一使用主题色。当前型号不支持的值仍由参数与提交校验处理。
            - 显式配置的自定义连接不再因与内置厂商同名而误用其上传规则；不同连接的 Key 和参数仍各自独立。

            ## 🌏 多语言与跨平台兼容

            - 补齐中英日韩的素材库、角色、工作流、设置、帮助和媒体编辑等界面文案；切换语言时刷新缓存标签，保留编辑草稿和运行会话。
            - MCP 工具目录支持分页浏览全部可用工具，简介优先说明用途；保留既有权限与执行策略，客户端可能需要刷新或重新连接。
            - 修复视频 Range 总长探测及有界整包读取回退，改善无声／有声片段拼接、音频入点与无损音轨保留；静音、音量和包络调整进入导出，无法保留声音时明确报错。
            - 完善 Mac 外部编辑器候选和手动选择入口，以及 Linux 标准文件 URI、特殊字符与剪贴板格式回退。

            ## ⚠️ 升级与兼容性

            - 本版数据库仍为 v23。升级前请导出重要项目并备份应用数据；旧程序可能无法读取较新的资产字段，不能仅靠重装旧版回退数据。
            - 资产包和快捷指令均以新身份追加，同名记录不覆盖；不携带连接凭据。资产包不迁移源画布节点或远端厂商绑定，快捷指令依赖的模型、工作流和素材由接收方配置。资产包预览会额外使用一份整包暂存空间，原生文件操作的取消需等待当前调用结束。
            - 失效记录清理不可撤销，会删除所选失效记录及关联，不删除磁盘文件和画布节点。无旧内容摘要的失效素材只标记为元数据匹配，须逐项确认；修复每批最多处理 500 个异常项、单次最多检查 10,000 个索引，未扫描项显示未知，指定参考图被删除后提示引用失效。
            - 内置模型候选不表示账号权限、余额或真实调用已验证。LibAPI 语音／音乐不支持直接引用素材进行声音克隆；PCM 未开放，参考数量、输出参数与上传权限以所选型号为准。透明背景的实际输出格式与 alpha 保留仍需核对原文件。
            - 异步生成沿用已有原任务取回机制；未拿到任务 ID 的未知提交不自动重投，也不能承诺自动恢复。视频复刻插件保持 v0.2.1，最低宿主为 v0.10.13；本地 ComfyUI、插件与原生文件能力仍需各自运行环境。即梦样片模式及样片转高清尚未接入。
            - 音频编辑可能触发画面重编码，解码、音轨保留及播放取决于系统和容器；整包回退限制单文件 64 MiB、并存缓存 128 MiB，正常 Range 读取不受该单文件限制。跨平台桌面功能仍须实际验收。
            - Windows 旧款无 AVX/AVX2 CPU 请使用 Legacy 包；Legacy 不包含本地 ONNX 和自动更新。macOS 仅提供 Apple Silicon 包，采用临时签名、未经 Apple 公证；首次打开方式见[安装说明](https://github.com/Tenney95/AI-Canvas-tauri/blob/master/doc/打包与发版流程.md#macos-临时签名与首次打开)。

            ## 📦 下载

            - 🪟 Windows：使用 `.exe` 或 `.msi`。
            - 🪟 Windows 旧款 CPU：使用名称含 `Legacy` 的 `.exe` 或 `.msi`。
            - 🍎 macOS：仅提供 M 系列芯片（Apple Silicon）的 `aarch64.dmg`。
            - 🐧 Linux：使用 `.AppImage`、`.deb` 或 `.rpm`。
          releaseDraft: true
          prerelease: false
          includeUpdaterJson: true
          args: --target ${{ matrix.target }}

      - name: Verify ad-hoc signature and macOS app startup
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          bundle_dir="src-tauri/target/${{ matrix.target }}/release/bundle/macos"
          shopt -s nullglob
          apps=("$bundle_dir"/*.app)
          if [ "${#apps[@]}" -ne 1 ]; then
            echo "Expected exactly one macOS app in $bundle_dir" >&2
            exit 1
          fi
          app="${apps[0]}"
          codesign --verify --deep --strict --verbose=2 "$app"
          signature="$(codesign --display --verbose=4 "$app" 2>&1)"
          if ! grep -q '^Signature=adhoc$' <<< "$signature"; then
            echo "Expected an ad-hoc signature on $app" >&2
            exit 1
          fi

          # This checks runtime startup on the runner, not Gatekeeper approval after download.
          smoke_dir="$(mktemp -d "${RUNNER_TEMP}/ai-canvas-macos-smoke.XXXXXX")"
          trap 'rm -rf "$smoke_dir"' EXIT
          ditto "$app" "$smoke_dir/$(basename "$app")"
          smoke_app="$smoke_dir/$(basename "$app")"
          open -a "$smoke_app"
          executable="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$smoke_app/Contents/Info.plist")"
          for attempt in {1..20}; do
            if pgrep -x "$executable" >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          echo "Ad-hoc signed app did not remain running: $executable" >&2
          exit 1

  publish-windows-legacy:
    name: Publish Windows x64 legacy
    needs: publish
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Install npm dependencies
        run: npm ci

      - name: Build Windows x64 legacy
        shell: pwsh
        env:
          RUSTFLAGS: -C target-cpu=x86-64 -C target-feature=-avx,-avx2,-fma
        run: |
          $legacyConfig = '{"productName":"AI Canvas Legacy","plugins":{"updater":{"endpoints":[]}},"bundle":{"createUpdaterArtifacts":false}}'
          node node_modules/@tauri-apps/cli/tauri.js build `
            --target x86_64-pc-windows-msvc `
            --config $legacyConfig `
            -- `
            --no-default-features

      - name: Upload Windows x64 legacy installers
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $bundleRoot = Resolve-Path "src-tauri/target/x86_64-pc-windows-msvc/release/bundle"
          $artifacts = @(
            Get-ChildItem -LiteralPath $bundleRoot -Recurse -File |
              Where-Object { $_.Extension -in '.exe', '.msi' }
          )
          if ($artifacts.Count -eq 0) {
            throw "No Windows x64 legacy installers were generated."
          }
          foreach ($artifact in $artifacts) {
            gh release upload "${{ github.ref_name }}" $artifact.FullName --clobber
          }

  finalize-release:
    name: Publish verified release
    needs: publish-windows-legacy
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Make release public after all checks pass
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit "${{ github.ref_name }}" --repo "${{ github.repository }}" --draft=false
