name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  quality:
    name: Quality gate
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      - name: Typecheck, test and build
        run: npm run ci

  publish:
    name: Publish ${{ matrix.target }}
    needs: quality
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-pc-windows-msvc
            os: windows-latest
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install dependencies (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev libgtk-3-dev libjavascriptcoregtk-4.1-dev libsoup-3.0-dev

      - name: Install npm dependencies
        run: npm ci

      - name: Build with Tauri Action
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # Tauri signs all macOS bundle components before packaging; no Apple credentials are needed.
          APPLE_SIGNING_IDENTITY: ${{ runner.os == 'macOS' && '-' || '' }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'AI Canvas v0.10.17 - 图片无损压缩与画布修复'
          releaseBody: |
            ## ✨ 版本摘要

            AI Canvas v0.10.17 新增图片节点无损压缩，完善 Mac 画布预览、引用输入、存储健康和短剧提取，并继续改善参考素材上传与媒体任务取回。

            ## 🖼️ 图片减重与生成可靠性

            - 图片节点新增「无损压缩」。PNG／JPEG 保持原格式和像素尺寸，仅在实际减重时创建独立素材副本；原图保留，无收益时不新增节点，支持撤销。
            - 参考图上传尝试无损减重；APIMart 图片处理后仍超过 20 MB 时提前提示，避免继续发送超限请求。
            - 完善 LibAPI 上传的认证、文件权限、素材策略与额度错误提示；加强中转接口的取消、结果类型校验和错误脱敏，上传中切换连接后不再交付旧连接结果。
            - 取回已有媒体任务时保留原任务身份，减少重复恢复及取消后的迟到回填；未取得任务 ID 的未知提交仍不会自动重投。

            ## 🎬 画布、Mac 与短剧制作体验

            - 修复 Mac 大图预览的 WebKit 兼容问题，改善返回启动页后项目缩略图仍显示旧内容的问题；缩略图增加文字和分镜表内容，并改善图片读取与编码兼容。
            - 修复引用胶囊后难以放置输入光标的问题，保留连续引用、换行和工作流可编辑值区。
            - 人物、场景、道具提取的空正文模板可使用当前文本节点内容；缺少正文时先提示，提取失败保留原文，不把无效结果写入资产库。
            - 分镜表的「画面」与「生成视频」列统一宽度和预览比例，普通与全屏视图一致。
            - 开发模式热更新继续沿用项目和生成任务状态，减少画布被重新初始化及任务被误判中断的情况。

            ## 🧹 存储健康与清理

            - 收紧概览布局，区分应用数据配额、项目素材与回收站占用；共享目录按文件路径去重，重复文件不再叠加到可释放空间。
            - 重复检测进一步核对内容，保留引用中的文件；扫描可取消，局部读取失败展示已读统计与未完成项，不能把未知状态当作可清理。
            - 清理前确认范围，删除前重新复核引用；结果区分成功、失败与实际释放量。未引用文件新增「打开所在位置」，方便先检查再处理。

            ## ⚠️ 升级与兼容性

            - 数据库仍为 v23。升级前请导出重要项目并备份应用数据；重装旧程序不等于回退数据。
            - 手动无损压缩仅支持桌面端 PNG／JPEG，单图上限为 32 MiB、2400 万像素、单边 16384 像素；不缩放、不转码，动画或不能安全减重的文件保留原样。第三方图片仍受跨源策略约束，无法安全读取时保留旧项目预览。
            - 内置模型能力不表示账号权限、额度或真实调用已经验证。Sora2U Seedance 2.0 的视频与音频参考合计最多 3 项，超限会提前提示；透明背景的实际输出仍以原文件为准。
            - 视频复刻插件保持 v0.2.1，最低宿主为 v0.10.13；本地 ComfyUI、插件与原生文件能力仍需各自运行环境。
            - Windows 旧款无 AVX／AVX2 CPU 请使用 Legacy 包；Legacy 不包含本地 ONNX 和自动更新。
            - macOS 仅提供 Apple Silicon 包，采用临时签名、未经 Apple 公证；首次打开方式见[安装说明](https://github.com/Tenney95/AI-Canvas-tauri/blob/master/doc/打包与发版流程.md#macos-临时签名与首次打开)。

            ## 📦 下载

            - 🪟 Windows：使用 `.exe` 或 `.msi`。
            - 🪟 Windows 旧款 CPU：使用名称含 `Legacy` 的 `.exe` 或 `.msi`。
            - 🍎 macOS：仅提供 M 系列芯片（Apple Silicon）的 `aarch64.dmg`。
            - 🐧 Linux：使用 `.AppImage`、`.deb` 或 `.rpm`。
          releaseDraft: true
          prerelease: false
          includeUpdaterJson: true
          args: --target ${{ matrix.target }}

      - name: Verify ad-hoc signature and macOS app startup
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          bundle_dir="src-tauri/target/${{ matrix.target }}/release/bundle/macos"
          shopt -s nullglob
          apps=("$bundle_dir"/*.app)
          if [ "${#apps[@]}" -ne 1 ]; then
            echo "Expected exactly one macOS app in $bundle_dir" >&2
            exit 1
          fi
          app="${apps[0]}"
          codesign --verify --deep --strict --verbose=2 "$app"
          signature="$(codesign --display --verbose=4 "$app" 2>&1)"
          if ! grep -q '^Signature=adhoc$' <<< "$signature"; then
            echo "Expected an ad-hoc signature on $app" >&2
            exit 1
          fi

          # This checks runtime startup on the runner, not Gatekeeper approval after download.
          smoke_dir="$(mktemp -d "${RUNNER_TEMP}/ai-canvas-macos-smoke.XXXXXX")"
          trap 'rm -rf "$smoke_dir"' EXIT
          ditto "$app" "$smoke_dir/$(basename "$app")"
          smoke_app="$smoke_dir/$(basename "$app")"
          open -a "$smoke_app"
          executable="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$smoke_app/Contents/Info.plist")"
          for attempt in {1..20}; do
            if pgrep -x "$executable" >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          echo "Ad-hoc signed app did not remain running: $executable" >&2
          exit 1

  publish-windows-legacy:
    name: Publish Windows x64 legacy
    needs: publish
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Install npm dependencies
        run: npm ci

      - name: Build Windows x64 legacy
        shell: pwsh
        env:
          RUSTFLAGS: -C target-cpu=x86-64 -C target-feature=-avx,-avx2,-fma
        run: |
          $legacyConfig = '{"productName":"AI Canvas Legacy","plugins":{"updater":{"endpoints":[]}},"bundle":{"createUpdaterArtifacts":false}}'
          node node_modules/@tauri-apps/cli/tauri.js build `
            --target x86_64-pc-windows-msvc `
            --config $legacyConfig `
            -- `
            --no-default-features

      - name: Upload Windows x64 legacy installers
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $bundleRoot = Resolve-Path "src-tauri/target/x86_64-pc-windows-msvc/release/bundle"
          $artifacts = @(
            Get-ChildItem -LiteralPath $bundleRoot -Recurse -File |
              Where-Object { $_.Extension -in '.exe', '.msi' }
          )
          if ($artifacts.Count -eq 0) {
            throw "No Windows x64 legacy installers were generated."
          }
          foreach ($artifact in $artifacts) {
            gh release upload "${{ github.ref_name }}" $artifact.FullName --clobber
          }

  finalize-release:
    name: Publish verified release
    needs: publish-windows-legacy
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Make release public after all checks pass
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit "${{ github.ref_name }}" --repo "${{ github.repository }}" --draft=false
