name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  quality:
    name: Quality gate
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      - name: Typecheck, test and build
        run: npm run ci

  publish:
    name: Publish ${{ matrix.target }}
    needs: quality
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-pc-windows-msvc
            os: windows-latest
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install dependencies (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev libgtk-3-dev libjavascriptcoregtk-4.1-dev libsoup-3.0-dev

      - name: Install npm dependencies
        run: npm ci

      - name: Build with Tauri Action
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # Tauri signs all macOS bundle components before packaging; no Apple credentials are needed.
          APPLE_SIGNING_IDENTITY: ${{ runner.os == 'macOS' && '-' || '' }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'AI Canvas v0.10.13 - 引用预览与逐镜制作'
          releaseBody: |
            ## ✨ 版本摘要

            AI Canvas v0.10.13 支持双击引用胶囊查看完整内容，让视频生成按指定镜头读取分镜要求，并完善视频复刻的角色替换、任务恢复和节点布局。资源加载、分组操作、ComfyUI 安装与 macOS 输入同步改善。

            ## 🔎 引用与内容预览

            - 提示词、分镜、角色库、资源详情和助手中的引用胶囊支持双击全屏查看，展示完整文本、图片、视频、音频及指定镜头内容。
            - 预览显示节点编号、镜头信息、模型参数和已有素材尺寸；支持继续打开正文中的引用并返回上一项。
            - 助手输入、消息正文和独立窗口使用统一引用胶囊；失效引用明确显示原因，不替换为其他素材。

            ## 🎬 逐镜制作与视频复刻

            - 视频可以通过稳定镜头引用消费分镜表，生成时读取本镜的景别、运镜、画面、对白、音效及实际时长；重排镜头不会串镜。
            - 从镜头引用或连接菜单创建视频时保留精确引用，减少额外全文节点；旧静态提示词不自动改写。
            - 视频复刻的分析同时读取用户替换图与关键帧联系表，按目标角色图描述面容、发型和服装；生成不再额外连接原片首帧。
            - 复刻任务减少分镜和说明节点，控制视频、音频与生成结果按分段排列；相同区间的音频参考复用原音。
            - 关闭并重新打开复刻窗口可恢复任务界面和进度；已确认失败或停止后支持重新开始，持续查询不再占用普通操作额度。

            ## 🗂️ 资源与桌面操作

            - 资源扫描分批展示已发现的素材，同范围刷新保留已有卡片；关闭或切换项目会取消后续扫描及过期更新。
            - 分组标题、颜色入口和背景展示更加紧凑，点击外部可关闭色板。
            - 恢复 macOS 鼠标与触控板输入分流；全屏弹窗蒙层支持拖动窗口，保留内容交互。
            - ComfyUI 安装信息读取失败时仍显示环境和安装位置表单，保留用户填写内容并提供重试；工作流管理入口位置同步调整。

            ## ⚠️ 升级与兼容性

            - 视频复刻插件 v0.2.1 要求宿主 v0.10.13 或更高版本；请先升级 AI Canvas，再升级插件。
            - 既有视频提示词不会自动迁移为精确镜头引用；需使用新胶囊替换旧正文，并保留人工补充要求。
            - 外部 MCP 连接仅支持 HTTPS 或本机 HTTP 的 Streamable HTTP，需明确选择连接和工具授权；暂不支持 OAuth、stdio 或非文本结果。停用连接不会撤销远端已经执行的操作，写入结果不确定时请先核实，避免重复调用。
            - ComfyUI 模型去重仅处理支持格式且至少 1 MiB 的模型文件；链接替换前应备份并停止服务。硬链接共享文件内容，任一路径原地修改会影响其他引用；软链接依赖保留副本的位置与权限。
            - IndexedDB schema 保持 v22，沿用已有项目、配置与凭据存储。CCC 外层删除会移除全部分组；只删除一组请进入分组管理。
            - 模型能力以厂商文档及实际接口为准，快速适配模板不能证明所有中转型号均支持相同参数；待验证配置仍需真实接口验收，媒体调用可能产生费用。
            - RunningHub、AutoDL、Blender、ComfyUI 和用户插件仍需对应运行环境。视频复刻需要对应插件与依赖，后台全片任务不会在应用重启后自动续跑；提交状态不确定时不会自动重投。可信 Python 插件具有当前用户权限，安装、启用或切换版本需原生确认。
            - AI 应用仍不支持写入其他画布节点或编排模型和文件操作。已有插件必须具有有效源码与 revision 摘要及完整原生私有快照，缺失时需重新安装。
            - Windows 不支持 AVX/AVX2 的旧款 CPU 请使用 Legacy 安装包；Legacy 不包含本地 ONNX 和自动更新。
            - 原生窗口、应用内 ComfyUI、MCP 控制桥、本地文件导出与方舟 SQLite 用量账本仅在桌面版可用；浏览器模式的 API Key 仅在当前会话有效，视频导出取决于本机编解码器。
            - macOS 本版只提供 Apple Silicon 安装包，旧版已公开的 Intel Mac 文件保留在对应 Release。安装包使用临时签名，未经过 Apple 公证；首次打开若被拦截，可在「系统设置 → 隐私与安全性」允许，更多处理方式见[首次打开说明](https://github.com/Tenney95/AI-Canvas-tauri/blob/master/doc/打包与发版流程.md#macos-临时签名与首次打开)。

            ## 📦 下载

            - 🪟 Windows：使用 `.exe` 或 `.msi`。
            - 🪟 Windows 旧款 CPU：使用名称含 `Legacy` 的 `.exe` 或 `.msi`。
            - 🍎 macOS：仅提供 M 系列芯片（Apple Silicon）的 `aarch64.dmg`，不再发布 Intel 安装包。
            - 🐧 Linux：使用 `.AppImage`、`.deb` 或 `.rpm`。
          releaseDraft: true
          prerelease: false
          includeUpdaterJson: true
          args: --target ${{ matrix.target }}

      - name: Verify ad-hoc signature and macOS app startup
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          bundle_dir="src-tauri/target/${{ matrix.target }}/release/bundle/macos"
          shopt -s nullglob
          apps=("$bundle_dir"/*.app)
          if [ "${#apps[@]}" -ne 1 ]; then
            echo "Expected exactly one macOS app in $bundle_dir" >&2
            exit 1
          fi
          app="${apps[0]}"
          codesign --verify --deep --strict --verbose=2 "$app"
          signature="$(codesign --display --verbose=4 "$app" 2>&1)"
          if ! grep -q '^Signature=adhoc$' <<< "$signature"; then
            echo "Expected an ad-hoc signature on $app" >&2
            exit 1
          fi

          # This checks runtime startup on the runner, not Gatekeeper approval after download.
          smoke_dir="$(mktemp -d "${RUNNER_TEMP}/ai-canvas-macos-smoke.XXXXXX")"
          trap 'rm -rf "$smoke_dir"' EXIT
          ditto "$app" "$smoke_dir/$(basename "$app")"
          smoke_app="$smoke_dir/$(basename "$app")"
          open -a "$smoke_app"
          executable="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$smoke_app/Contents/Info.plist")"
          for attempt in {1..20}; do
            if pgrep -x "$executable" >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          echo "Ad-hoc signed app did not remain running: $executable" >&2
          exit 1

  publish-windows-legacy:
    name: Publish Windows x64 legacy
    needs: publish
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Install npm dependencies
        run: npm ci

      - name: Build Windows x64 legacy
        shell: pwsh
        env:
          RUSTFLAGS: -C target-cpu=x86-64 -C target-feature=-avx,-avx2,-fma
        run: |
          $legacyConfig = '{"productName":"AI Canvas Legacy","plugins":{"updater":{"endpoints":[]}},"bundle":{"createUpdaterArtifacts":false}}'
          node node_modules/@tauri-apps/cli/tauri.js build `
            --target x86_64-pc-windows-msvc `
            --config $legacyConfig `
            -- `
            --no-default-features

      - name: Upload Windows x64 legacy installers
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $bundleRoot = Resolve-Path "src-tauri/target/x86_64-pc-windows-msvc/release/bundle"
          $artifacts = @(
            Get-ChildItem -LiteralPath $bundleRoot -Recurse -File |
              Where-Object { $_.Extension -in '.exe', '.msi' }
          )
          if ($artifacts.Count -eq 0) {
            throw "No Windows x64 legacy installers were generated."
          }
          foreach ($artifact in $artifacts) {
            gh release upload "${{ github.ref_name }}" $artifact.FullName --clobber
          }

  finalize-release:
    name: Publish verified release
    needs: publish-windows-legacy
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Make release public after all checks pass
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit "${{ github.ref_name }}" --repo "${{ github.repository }}" --draft=false
