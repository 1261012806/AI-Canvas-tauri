name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  quality:
    name: Quality gate
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      - name: Typecheck, test and build
        run: npm run ci

  publish:
    name: Publish ${{ matrix.target }}
    needs: quality
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-pc-windows-msvc
            os: windows-latest
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install dependencies (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev libgtk-3-dev libjavascriptcoregtk-4.1-dev libsoup-3.0-dev

      - name: Install npm dependencies
        run: npm ci

      - name: Build with Tauri Action
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # Tauri signs all macOS bundle components before packaging; no Apple credentials are needed.
          APPLE_SIGNING_IDENTITY: ${{ runner.os == 'macOS' && '-' || '' }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'AI Canvas v0.10.19 - 本集资产与角色武器'
          releaseBody: |
            ## ✨ 版本摘要

            AI Canvas v0.10.19 增加本集角色／道具清单与角色武器管理，让 AI 提取、资产入库和绑定分步完成；同时补齐无参考视频生成确认，改善 ComfyUI H3 工作流、视频预览与 Windows 软件内更新。

            ## 🎭 本集资产与角色武器

            - 剧本创作工作台新增“本集角色”和“本集道具”：AI 提取先显示预览，确认加入本集清单后再编辑，由你选择添加到资产库或绑定已有资产，避免直接自动入库。
            - 创作资产新增独立“武器”分类，项目和全局角色均可多选绑定同库武器；解除绑定保留武器，删除武器时清理角色关联。
            - 资产包导入导出、跨库复制、本集角色绑定和项目手动云同步保留武器依赖；@ 引用与 MCP 既有资产工具支持武器字段。引用角色不会自动加入武器参考图。

            ## 🎬 视频与创作流程

            - 手动生成视频时，没有有效图片、视频、音频、首尾帧或角色参考会先二次确认；取消后保留已有内容，不提交生成任务。
            - 视频暂停后支持拖动进度，并可用方向键按 0.1 秒微调；分镜表精简已回填视频的操作按钮。
            - 新增六格线稿分镜快捷指令，标明指令执行位置与内容来源；修复 Markdown 文件拖入时的节点类型，并统一剧本创作工作台背景。

            ## 🎛️ ComfyUI 与桌面更新

            - 新增 H3 低显存保守与自定义策略，管理动态显存和卸载选项；优化默认关闭，需工作流与后端插件支持，不保证任意工作流均可运行。
            - ComfyUI 优先保存正式输出；查询遇到鉴权失败时明确提示并保留任务，依赖安装展示阶段进度并支持取消。
            - Windows 原位更新在目标目录不可写且符合条件时请求同账户 UAC 授权，减少必须先以管理员模式启动应用才能更新的情况；不支持切换至另一管理员账户安装。

            ## ⚠️ 升级与兼容性

            - 数据库维持 v26。升级前请导出重要项目并备份应用数据；安装旧程序不等于回退数据。团队成员应统一升级，旧客户端无法完整处理新增武器字段。
            - 云同步仍仅支持项目资产的手动同步，不共享全局资产、不自动监听，也不传播本地删除。云端清空或删除保留本地资产，操作前须停止其他客户端写入。
            - 本集清单、武器关联、真实 S3 同步、模型调用及各平台安装升级仍需在实际环境验收；自动检查不代替桌面端验证。
            - Windows 旧款无 AVX／AVX2 CPU 请使用 Legacy 包；Legacy 不包含本地 ONNX 和自动更新。
            - macOS 仅提供 Apple Silicon 包，采用临时签名、未经 Apple 公证；首次打开方式见[安装说明](https://github.com/Tenney95/AI-Canvas-tauri/blob/master/doc/打包与发版流程.md#macos-临时签名与首次打开)。

            ## 📦 下载

            - 🪟 Windows：使用 `.exe` 或 `.msi`。
            - 🪟 Windows 旧款 CPU：使用名称含 `Legacy` 的 `.exe` 或 `.msi`。
            - 🍎 macOS：仅提供 M 系列芯片（Apple Silicon）的 `aarch64.dmg`。
            - 🐧 Linux：使用 `.AppImage`、`.deb` 或 `.rpm`。
          releaseDraft: true
          prerelease: false
          includeUpdaterJson: true
          args: --target ${{ matrix.target }}

      - name: Verify ad-hoc signature and macOS app startup
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          bundle_dir="src-tauri/target/${{ matrix.target }}/release/bundle/macos"
          shopt -s nullglob
          apps=("$bundle_dir"/*.app)
          if [ "${#apps[@]}" -ne 1 ]; then
            echo "Expected exactly one macOS app in $bundle_dir" >&2
            exit 1
          fi
          app="${apps[0]}"
          codesign --verify --deep --strict --verbose=2 "$app"
          signature="$(codesign --display --verbose=4 "$app" 2>&1)"
          if ! grep -q '^Signature=adhoc$' <<< "$signature"; then
            echo "Expected an ad-hoc signature on $app" >&2
            exit 1
          fi

          # This checks runtime startup on the runner, not Gatekeeper approval after download.
          smoke_dir="$(mktemp -d "${RUNNER_TEMP}/ai-canvas-macos-smoke.XXXXXX")"
          trap 'rm -rf "$smoke_dir"' EXIT
          ditto "$app" "$smoke_dir/$(basename "$app")"
          smoke_app="$smoke_dir/$(basename "$app")"
          open -a "$smoke_app"
          executable="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$smoke_app/Contents/Info.plist")"
          for attempt in {1..20}; do
            if pgrep -x "$executable" >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          echo "Ad-hoc signed app did not remain running: $executable" >&2
          exit 1

  publish-windows-legacy:
    name: Publish Windows x64 legacy
    needs: publish
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Install npm dependencies
        run: npm ci

      - name: Build Windows x64 legacy
        shell: pwsh
        env:
          RUSTFLAGS: -C target-cpu=x86-64 -C target-feature=-avx,-avx2,-fma
        run: |
          $legacyConfig = '{"productName":"AI Canvas Legacy","plugins":{"updater":{"endpoints":[]}},"bundle":{"createUpdaterArtifacts":false}}'
          node node_modules/@tauri-apps/cli/tauri.js build `
            --target x86_64-pc-windows-msvc `
            --config $legacyConfig `
            -- `
            --no-default-features

      - name: Upload Windows x64 legacy installers
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $bundleRoot = Resolve-Path "src-tauri/target/x86_64-pc-windows-msvc/release/bundle"
          $artifacts = @(
            Get-ChildItem -LiteralPath $bundleRoot -Recurse -File |
              Where-Object { $_.Extension -in '.exe', '.msi' }
          )
          if ($artifacts.Count -eq 0) {
            throw "No Windows x64 legacy installers were generated."
          }
          foreach ($artifact in $artifacts) {
            gh release upload "${{ github.ref_name }}" $artifact.FullName --clobber
          }

  finalize-release:
    name: Publish verified release
    needs: publish-windows-legacy
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Make release public after all checks pass
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit "${{ github.ref_name }}" --repo "${{ github.repository }}" --draft=false
