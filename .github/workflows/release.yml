name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  quality:
    name: Quality gate
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      - name: Typecheck, test and build
        run: npm run ci

  publish:
    name: Publish ${{ matrix.target }}
    needs: quality
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-pc-windows-msvc
            os: windows-latest
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install dependencies (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev libgtk-3-dev libjavascriptcoregtk-4.1-dev libsoup-3.0-dev

      - name: Install npm dependencies
        run: npm ci

      - name: Build with Tauri Action
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # Tauri signs all macOS bundle components before packaging; no Apple credentials are needed.
          APPLE_SIGNING_IDENTITY: ${{ runner.os == 'macOS' && '-' || '' }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'AI Canvas v0.10.15 - 创作资产与媒体生成恢复'
          releaseBody: |
            ## ✨ 版本摘要

            AI Canvas v0.10.15 打通全局创作资产、分镜成片与剪辑时间轴，完善图片、视频和音频的原任务恢复。图片生成增加质量与透明背景设置，并保留用户选择的比例。

            ## 🎭 创作资产与分镜成片

            - 统一管理全局人物、场景与道具，支持参考图绑定、角色素材引用及助手操作；完善引用分类、分页和人物卡片交互。
            - 资源文件支持按名称、创建时间、修改时间、大小及最近使用排序，并记住排序选择。
            - 分镜表增加独立的“生成视频”列，支持生成结果自动回填、手动绑定、更换和预览；可将已就绪成片推送时间轴，并附带对应字幕和配音。

            ## 🔄 媒体任务恢复

            - 图片、视频和音频任务在查询中断、结果下载或本地保存失败后保留已有任务，支持继续取回原结果，减少重复提交。
            - CCC 图片兼容真实异步任务响应；提交状态未知时明确提示，不自动重新发起生成。
            - 完善节点、批量、对话及 MCP 入口的任务保存与交付确认，结果保存和目标回填成功后再清理对应任务。

            ## 🖼️ 图片参数与即梦模型

            - GPT Image 按厂商和具体型号展示独立的“生成质量”与“生成背景”，支持已声明的透明背景请求；分辨率保持独立设置。
            - 切换图片模型保留用户所选比例，避免反复变为方图；参数贯通单张、批量、重新生成和历史记录，选中样式保持一致。
            - 修复即梦共享模型目录，普通 Seedance 2.5 与 Seedance 2.0 Mini 可在设置中列出并勾选，保留已有模型选择。

            ## 🎨 画布与工作流交互

            - 画布图片背景增加透明度、滤镜、定位、底色与蒙版调整，开放内部组件及输入框配色，统一主题表现。
            - 云工作流参数使用紧凑浮层，修正 RunningHub 当前输入与分站官方上传；提示词润色可独立选择文本模型并引用素材。
            - 改善视频封面、节点放大遮罩和有内容节点的选择交互。

            ## ⚠️ 升级与兼容性

            - 全局场景与道具增加存储表，本地数据库从 v22 升至 v23，保留已有项目和凭据。升级前请导出重要项目并备份应用数据；旧版本可能无法打开升级后的数据库，不能仅重装旧版作为数据回退。
            - 旧分镜的“画面”继续作为参考图，不自动迁入“生成视频”列；推送时间轴前需核对独立绑定的成片。人工更换或解绑的成片不会被迟到的旧生成结果覆盖。
            - 原任务恢复依赖已保存的任务记录与远端 ID；未拿到 ID 的未知提交不能承诺自动恢复，也不会自动重投。RunningHub／工作流 API 的纯消息任务沿用原项目、原会话的专用恢复入口。自定义接口试跑的续查仍只覆盖当前应用进程。
            - 质量、透明背景、参考素材和输出格式以所选渠道的实际能力为准。即梦样片模式及样片转高清尚未接入；普通 480p 不等同于样片模式。模型勾选不代表账号权限或余额已验证。
            - ComfyUI 角色参考包仍依赖对应加载器和已有槽位，更换服务后需重新选择。视频复刻插件仍为 v0.2.1，最低宿主版本 v0.10.13；可信 Python 插件的原生确认和运行边界保持不变。
            - 本地 ComfyUI、原生窗口、MCP 控制桥、文件导出和用量账本依赖桌面环境；浏览器模式的 API Key 仅在当前会话有效。其他工作流平台与插件仍需各自的运行环境。
            - Windows 不支持 AVX/AVX2 的旧款 CPU 请使用 Legacy 安装包；Legacy 不包含本地 ONNX 和自动更新。
            - macOS 仅提供 Apple Silicon 安装包，历史 Intel Mac 文件保留在对应旧 Release。安装包采用临时签名，未经 Apple 公证；首次打开被拦截时可在「系统设置 → 隐私与安全性」中允许，详见[首次打开说明](https://github.com/Tenney95/AI-Canvas-tauri/blob/master/doc/打包与发版流程.md#macos-临时签名与首次打开)。

            ## 📦 下载

            - 🪟 Windows：使用 `.exe` 或 `.msi`。
            - 🪟 Windows 旧款 CPU：使用名称含 `Legacy` 的 `.exe` 或 `.msi`。
            - 🍎 macOS：仅提供 M 系列芯片（Apple Silicon）的 `aarch64.dmg`。
            - 🐧 Linux：使用 `.AppImage`、`.deb` 或 `.rpm`。
          releaseDraft: true
          prerelease: false
          includeUpdaterJson: true
          args: --target ${{ matrix.target }}

      - name: Verify ad-hoc signature and macOS app startup
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          bundle_dir="src-tauri/target/${{ matrix.target }}/release/bundle/macos"
          shopt -s nullglob
          apps=("$bundle_dir"/*.app)
          if [ "${#apps[@]}" -ne 1 ]; then
            echo "Expected exactly one macOS app in $bundle_dir" >&2
            exit 1
          fi
          app="${apps[0]}"
          codesign --verify --deep --strict --verbose=2 "$app"
          signature="$(codesign --display --verbose=4 "$app" 2>&1)"
          if ! grep -q '^Signature=adhoc$' <<< "$signature"; then
            echo "Expected an ad-hoc signature on $app" >&2
            exit 1
          fi

          # This checks runtime startup on the runner, not Gatekeeper approval after download.
          smoke_dir="$(mktemp -d "${RUNNER_TEMP}/ai-canvas-macos-smoke.XXXXXX")"
          trap 'rm -rf "$smoke_dir"' EXIT
          ditto "$app" "$smoke_dir/$(basename "$app")"
          smoke_app="$smoke_dir/$(basename "$app")"
          open -a "$smoke_app"
          executable="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$smoke_app/Contents/Info.plist")"
          for attempt in {1..20}; do
            if pgrep -x "$executable" >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          echo "Ad-hoc signed app did not remain running: $executable" >&2
          exit 1

  publish-windows-legacy:
    name: Publish Windows x64 legacy
    needs: publish
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Install npm dependencies
        run: npm ci

      - name: Build Windows x64 legacy
        shell: pwsh
        env:
          RUSTFLAGS: -C target-cpu=x86-64 -C target-feature=-avx,-avx2,-fma
        run: |
          $legacyConfig = '{"productName":"AI Canvas Legacy","plugins":{"updater":{"endpoints":[]}},"bundle":{"createUpdaterArtifacts":false}}'
          node node_modules/@tauri-apps/cli/tauri.js build `
            --target x86_64-pc-windows-msvc `
            --config $legacyConfig `
            -- `
            --no-default-features

      - name: Upload Windows x64 legacy installers
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $bundleRoot = Resolve-Path "src-tauri/target/x86_64-pc-windows-msvc/release/bundle"
          $artifacts = @(
            Get-ChildItem -LiteralPath $bundleRoot -Recurse -File |
              Where-Object { $_.Extension -in '.exe', '.msi' }
          )
          if ($artifacts.Count -eq 0) {
            throw "No Windows x64 legacy installers were generated."
          }
          foreach ($artifact in $artifacts) {
            gh release upload "${{ github.ref_name }}" $artifact.FullName --clobber
          }

  finalize-release:
    name: Publish verified release
    needs: publish-windows-legacy
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Make release public after all checks pass
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit "${{ github.ref_name }}" --repo "${{ github.repository }}" --draft=false
